
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // 1. Apply theme class synchronously so there is no flash of unstyled
      //    content before React and the ThemeProvider initialise.
      (function () {
        var stored = localStorage.getItem('vite-ui-theme');
        var dark = stored === 'dark' ||
          (!stored || stored === 'system') &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.add(dark ? 'dark' : 'light');
        document.documentElement.style.backgroundColor = dark ? '#000000' : '#f4f4f6';
      })();

      // 2. Decode the path that 404.html encoded into the query string and
      //    restore it via history.replaceState before React Router initialises.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(
            null, null,
            decoded[0] + (decoded[1] ? '&' + decoded[1] : '') + l.hash
          );
        }
      }(window.location));
    </script>
    <title>Stephen Li</title>
    <meta name="description" content="Professional portfolio showcasing creative development and design work" />
    <meta name="author" content="Stephen Li" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <meta property="og:title" content="Stephen Li - Digital Portfolio" />
    <meta property="og:description" content="Professional portfolio showcasing creative development and design work" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@lovable_dev" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
