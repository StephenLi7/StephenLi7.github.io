
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Decode the path that 404.html encoded into the query string and
      // restore it via history.replaceState before React Router initialises.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(
            null, null,
            decoded[0] + (decoded[1] ? '&' + decoded[1] : '') + l.hash
          );
        }
      }(window.location));
    </script>
    <title>Stephen Li</title>
    <meta name="description" content="Stephen Li's personal website — data and product work, hobbies, and photos." />
    <meta name="author" content="Stephen Li" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <meta property="og:title" content="Stephen Li" />
    <meta property="og:description" content="Stephen Li's personal website — data and product work, hobbies, and photos." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stephenli7.github.io" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
