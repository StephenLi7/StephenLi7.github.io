<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="shape">
      <rect width="32" height="32" rx="6"/>
    </clipPath>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a8fa8"/>
      <stop offset="100%" stop-color="#1e3d4d"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4eaf4"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#shape)">
    <!-- Night sky -->
    <rect width="32" height="32" fill="#0d1b2a"/>

    <!-- Twinkling stars -->
    <circle cx="4" cy="4" r="0.9" fill="white">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="28" cy="3" r="0.7" fill="white">
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="1.8s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="26" cy="9" r="0.6" fill="white">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.7s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
    <circle cx="20" cy="3" r="0.5" fill="white">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite" begin="0.9s"/>
    </circle>

    <!-- Crescent moon (gently pulses) -->
    <g>
      <animate attributeName="opacity" values="1;0.78;1" dur="5s" repeatCount="indefinite"/>
      <circle cx="8" cy="10" r="3.5" fill="#ffedb3"/>
      <!-- cutout to form crescent -->
      <circle cx="10.2" cy="8.4" r="2.7" fill="#0d1b2a"/>
    </g>

    <!-- Mountain body -->
    <polygon points="16,5 3,28 29,28" fill="url(#mtn)"/>

    <!-- Snow cap -->
    <polygon points="16,5 12,14 20,14" fill="url(#snow)"/>

    <!-- Ground strip -->
    <rect x="0" y="27" width="32" height="8" fill="#07111a"/>
  </g>
</svg>
